spring.application.name=jobqueue

spring.datasource.url=jdbc:postgresql://localhost:5433/jobs?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.flyway.enabled=true
spring.flyway.schemas=jobs
spring.flyway.default-schema=jobs
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Asia/Kolkata

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.default_schema=jobs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.property-naming-strategy=SNAKE_CASE
server.port=3000

spring.flyway.create-schemas=true

logging.level.org.springframework.web=DEBUG
logging.level.web=DEBUG
logging.level.org.flywaydb=DEBUG

logging.level.org.springframework.boot.context.config=TRACE

spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms



spring.task.scheduling.pool.size=10


# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
